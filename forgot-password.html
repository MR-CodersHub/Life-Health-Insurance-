<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | WellSure Insurance Portal</title>
  <meta name="description" content="Reset your WellSure policy account password securely via email verification code.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E67543'><path d='M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm-1 14.5l-3.5-3.5 1.41-1.41L11 13.67l5.59-5.59L18 9.5 11 16.5z'/></svg>">
  
  <!-- Google Fonts: Syne & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3.3 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Core Stylesheet & Authentication Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Minimal Authentication Header -->
  <header class="ws-auth-header">
    <a class="ws-auth-brand" href="index.html" aria-label="WellSure Homepage">
      <div class="ws-logo-icon">
        <i class="bi bi-shield-fill-check"></i>
      </div>
      <div class="ws-logo-text">
        <span class="ws-logo-title">Well<span>Sure</span></span>
      </div>
    </a>

    <div class="ws-auth-controls">
      <button class="ws-icon-btn theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="ws-icon-btn ws-dir-btn direction-toggle-btn" aria-label="Toggle Direction" title="Toggle RTL/LTR">
        RTL
      </button>
      <a href="index.html" class="auth-home-btn" aria-label="Return to Homepage">
        <i class="bi bi-house-door-fill"></i>
        <span>Home</span>
      </a>
    </div>
  </header>

  <main class="auth-split-wrapper justify-content-center align-items-center p-3 p-md-5">
    <div class="auth-form-container" style="max-width: 440px;">
      
      <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 auth-card" style="background: var(--color-card-bg);">
        <div class="text-center mb-4">
          <div class="ws-logo-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem; background: rgba(230, 117, 67, 0.15); color: var(--color-terracotta);">
            <i class="bi bi-key-fill"></i>
          </div>
          <h2 class="auth-form-title fs-3 mb-2">Forgot Password?</h2>
          <p class="auth-form-subtitle small">
            Enter your registered email address and we'll dispatch a 6-digit secure verification code to reset your account credentials.
          </p>
        </div>

        <form id="forgotForm" class="needs-validation" novalidate onsubmit="handleForgotPasswordSubmit(event)">
          <div class="auth-input-group mb-4">
            <label for="resetEmail" class="form-label">
              <span>Email Address <span class="text-danger">*</span></span>
            </label>
            <div class="auth-input-wrapper">
              <i class="bi bi-envelope auth-input-icon"></i>
              <input 
                type="email" 
                class="auth-form-control" 
                id="resetEmail" 
                name="email" 
                placeholder="name@example.com" 
                value="client@wellsure.demo" 
                required 
                autocomplete="email"
              >
            </div>
            <div class="invalid-feedback">Please enter your registered email address.</div>
          </div>

          <button type="submit" class="btn btn-ws-primary w-100 justify-content-center py-3 fs-6 mb-3" id="btnForgotSubmit">
            <span>Send Reset Code</span>
            <i class="bi bi-send-fill ms-2"></i>
          </button>

          <div class="text-center">
            <a href="login.html" class="small text-muted text-decoration-none fw-bold d-inline-flex align-items-center gap-1">
              <i class="bi bi-arrow-left"></i>
              <span>Return to Sign In</span>
            </a>
          </div>
        </form>
      </div>

    </div>
  </main>

  <!-- Essential JS Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/direction.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
