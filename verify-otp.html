<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email OTP | WellSure Insurance Portal</title>
  <meta name="description" content="Enter the 6-digit verification code sent to your email to verify your WellSure account.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E67543'><path d='M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm-1 14.5l-3.5-3.5 1.41-1.41L11 13.67l5.59-5.59L18 9.5 11 16.5z'/></svg>">
  
  <!-- Google Fonts: Syne & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3.3 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Core Stylesheet & Authentication Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Minimal Authentication Header -->
  <header class="ws-auth-header">
    <a class="ws-auth-brand" href="index.html" aria-label="WellSure Homepage">
      <div class="ws-logo-icon">
        <i class="bi bi-shield-fill-check"></i>
      </div>
      <div class="ws-logo-text">
        <span class="ws-logo-title">Well<span>Sure</span></span>
      </div>
    </a>

    <div class="ws-auth-controls">
      <button class="ws-icon-btn theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="ws-icon-btn ws-dir-btn direction-toggle-btn" aria-label="Toggle Direction" title="Toggle RTL/LTR">
        RTL
      </button>
      <a href="index.html" class="auth-home-btn" aria-label="Return to Homepage">
        <i class="bi bi-house-door-fill"></i>
        <span>Home</span>
      </a>
    </div>
  </header>

  <main class="auth-split-wrapper justify-content-center align-items-center p-3 p-md-5">
    <div class="auth-form-container" style="max-width: 480px;">
      
      <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 auth-card" style="background: var(--color-card-bg);">
        <div class="text-center mb-4">
          <div class="ws-logo-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem; background: rgba(64, 103, 27, 0.15); color: var(--color-olive-deep);">
            <i class="bi bi-envelope-check-fill"></i>
          </div>
          <h2 class="auth-form-title fs-3 mb-2">Verify Your Email</h2>
          <p class="auth-form-subtitle small mb-1">
            We have dispatched a 6-digit verification code to:
          </p>
          <strong class="text-olive d-block" id="displayTargetEmail">client@wellsure.demo</strong>
          <small class="text-muted" style="font-size: 0.76rem;">(Demo code: enter any 6 digits e.g. 1 2 3 4 5 6)</small>
        </div>

        <form id="otpForm" onsubmit="handleOtpSubmit(event)">
          
          <!-- 6-Digit Auto-Advancing OTP Inputs Grid -->
          <div class="otp-inputs-grid" id="otpInputsGrid">
            <input type="text" class="otp-digit-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required autofocus>
            <input type="text" class="otp-digit-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" class="otp-digit-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" class="otp-digit-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" class="otp-digit-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" class="otp-digit-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          </div>

          <button type="submit" class="btn btn-ws-primary w-100 justify-content-center py-3 fs-6 mb-3" id="btnVerifyOtp">
            <span>Verify &amp; Continue</span>
            <i class="bi bi-shield-check ms-2"></i>
          </button>

          <div class="text-center">
            <span class="small text-muted">Didn't receive the email?</span>
            <button type="button" class="btn btn-link p-0 text-terracotta fw-bold small text-decoration-none ms-1" id="btnResendCode">
              Resend Code <span id="resendCountdown" class="text-muted fw-normal ms-1">45s</span>
            </button>
          </div>

          <div class="text-center mt-3 pt-3 border-top">
            <a href="login.html" class="small text-muted text-decoration-none fw-bold d-inline-flex align-items-center gap-1">
              <i class="bi bi-arrow-left"></i>
              <span>Back to Login</span>
            </a>
          </div>

        </form>
      </div>

    </div>
  </main>

  <!-- Essential JS Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/direction.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Extract email from query parameter if present
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      if (email) {
        const displayEl = document.getElementById('displayTargetEmail');
        if (displayEl) displayEl.textContent = decodeURIComponent(email);
      }
    });
  </script>
</body>
</html>
